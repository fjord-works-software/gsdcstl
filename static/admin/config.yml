backend:
  name: github
  repo: fjord-works-software/gsdcstl
  branch: main
  base_url: https://sveltia-cms-auth.fjordworkssoftware.workers.dev

media_folder: static/images
public_folder: /images

# Collections mirror the site navigation (src/lib/nav.ts) so an editor finds a
# page in the admin the same way they find it on the site. Keep the two in sync.
collections:
  - name: home
    label: Home
    files:
      - label: Home Page
        name: home
        file: content/pages/home.md
        fields:
          - { label: Title, name: title, widget: string }
          - label: Banner Slides
            name: slides
            widget: list
            label_singular: Slide
            summary: "{{fields.alt}}"
            fields:
              - { label: Image, name: image, widget: image }
              - { label: Alt Text, name: alt, widget: string, hint: "Describes the image for screen readers" }
          - { label: Content, name: body, widget: markdown }

  - name: club-info
    label: Club Info
    files:
      - label: Club Info
        name: club-info
        file: content/pages/club-info.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Content, name: body, widget: markdown }

      - label: Constitution & By-Laws
        name: constitution-by-laws
        file: content/pages/constitution-by-laws.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Revision Note, name: revision_note, widget: string, hint: "e.g. Revision: 02/01/2020 · Adopted: 03/27/2020" }
          - { label: Content, name: body, widget: markdown }

      - label: Club Contacts
        name: contacts
        file: content/contacts.json
        format: json
        fields:
          - { label: Year, name: year, widget: string }
          - { label: Club Phone, name: phone, widget: string }
          - label: Officers
            name: officers
            widget: list
            label_singular: Officer
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Email, name: email, widget: string }
          - label: Board of Directors
            name: board
            widget: list
            label_singular: Board Member
            fields:
              - { label: Name, name: name, widget: string }

      - label: Club Membership
        name: membership
        file: content/pages/membership.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Content, name: body, widget: markdown }

  - name: calendar
    label: Calendar
    files:
      - label: Calendar (Google Calendar URL)
        name: calendar-main
        file: content/pages/calendar-main.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Google Calendar Embed URL, name: google_calendar_url, widget: string, hint: "Paste the embed URL from Google Calendar > Settings > Integrate calendar" }

      - label: Regular Meetings
        name: calendar
        file: content/pages/calendar.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Content, name: body, widget: markdown }

  - name: education
    label: Education
    files:
      - label: Education (Breed Standard)
        name: education
        file: content/pages/education.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: string }
          - { label: Video URL 1, name: video_url_1, widget: string, hint: "YouTube embed URL, e.g. https://www.youtube.com/embed/..." }
          - { label: Video URL 2, name: video_url_2, widget: string, hint: "YouTube embed URL, e.g. https://www.youtube.com/embed/..." }
          - { label: Content, name: body, widget: markdown }

  - name: events
    label: Events
    files:
      - label: Events
        name: events
        file: content/pages/events.md
        fields:
          - { label: Title, name: title, widget: string }
          - label: Event Flyer Image
            name: event_flyer
            widget: image
            required: false
            hint: "Upload the current event flyer image"
          - { label: Description, name: body, widget: markdown }

      - label: Show Premium
        name: show-premium
        file: content/pages/show-premium.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Content, name: body, widget: markdown }

      - label: Event Results
        name: event-results
        file: content/pages/event-results.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Content, name: body, widget: markdown }

  - divider: true

  - name: brags
    label: Brag Entries
    label_singular: Brag
    folder: content/brags
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Full registered name and nickname, e.g. CH Guardians Gold Medal — 'Blondie'"
      - label: Date
        name: date
        widget: datetime
        type: date
        format: YYYY-MM-DD
      - label: Photo
        name: image
        widget: image
        required: false
      - label: Content
        name: body
        widget: markdown
        hint: "Include pedigree info (sire, dam, owners), show results, and any other details"

  - name: brags-pages
    label: Brags
    files:
      - label: Hall of Fame
        name: hall-of-fame
        file: content/hall-of-fame.json
        format: json
        fields:
          - label: Entries
            name: entries
            widget: list
            label_singular: Entry
            fields:
              - { label: Date, name: date, widget: string }
              - { label: Title / Achievement, name: title, widget: string }
              - { label: Dog, name: dog, widget: string }
              - { label: Member(s), name: member, widget: string }

      - label: "Wag 'N' Tongue Newsletters"
        name: wag-n-tongue
        file: content/wag-n-tongue.json
        format: json
        fields:
          - label: Newsletters
            name: newsletters
            widget: list
            label_singular: Newsletter
            fields:
              - { label: Label, name: label, widget: string, hint: "e.g. January 2018" }
              - { label: Filename, name: file, widget: string, hint: "PDF filename in /static/Documents/Wags/, e.g. January 2018 wag.pdf" }

      - label: Royal Hecht Awards (Intro & Point System)
        name: royal-hecht-awards
        file: content/pages/royal-hecht-awards.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: string }
          - { label: Content, name: body, widget: markdown }

  - name: royal-hecht-years
    label: Royal Hecht Years
    label_singular: Year
    folder: content/royal-hecht
    create: true
    extension: json
    format: json
    slug: "{{fields.year}}"
    identifier_field: year
    summary: "{{fields.year}}"
    fields:
      - { label: Year, name: year, widget: number, value_type: int }
      - { label: Ceremony Date, name: date, widget: string, required: false, hint: "e.g. April 21, 2026" }
      - { label: Chairperson, name: chairperson, widget: string, required: false }
      - label: Members
        name: members
        widget: list
        label_singular: Member
        summary: "{{fields.name}}"
        fields:
          - { label: Member(s), name: name, widget: string }
          - label: Awards
            name: awards
            widget: list
            label_singular: Award
            summary: "{{fields.category}}"
            fields:
              - { label: Award / Title, name: category, widget: string }
              - { label: Dog / Detail, name: detail, widget: string, required: false }

  - divider: true

  - name: photo-gallery
    label: Photo Gallery
    files:
      - label: Photo Gallery (Main Page)
        name: photo-gallery
        file: content/pages/photo-gallery.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Content, name: body, widget: markdown }





  - name: galleries
    label: Galleries
    label_singular: Gallery
    folder: content/galleries
    create: true
    media_folder: "{{media_folder}}/{{slug}}"
    public_folder: "{{public_folder}}/{{slug}}"
    identifier_field: title
    summary: "{{fields.order}}. {{fields.title}}"
    sortable_fields: [order, title]
    fields:
      - { label: Title, name: title, widget: string, hint: "Shown in the nav, on the gallery index and as the page heading" }
      - { label: Date / Subtitle, name: subtitle, widget: string, required: false }
      - { label: Order, name: order, widget: number, value_type: int, hint: "Lower numbers come first in the nav and on the index" }
      - { label: Description, name: body, widget: markdown, required: false }
      - label: Photos
        name: photos
        widget: list
        label_singular: Photo
        summary: "{{fields.caption}}"
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Caption, name: caption, widget: string, hint: "Who/what is pictured. Also used as alt text." }

  - name: breeders
    label: Breeders
    files:
      - label: Breeder Directory
        name: breeders
        file: content/pages/breeders.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Content, name: body, widget: markdown, hint: "List breeders and the disclaimer text" }

      - label: Stud Dogs
        name: stud-dogs
        file: content/stud-dogs.json
        format: json
        fields:
          - label: Dogs
            name: dogs
            widget: list
            label_singular: Stud Dog
            fields:
              - { label: Registered Name, name: registered_name, widget: string }
              - { label: Call Name, name: call_name, widget: string }
              - { label: Date of Birth, name: dob, widget: string, required: false }
              - { label: Stud Fee, name: stud_fee, widget: string }
              - { label: Requirements, name: requirements, widget: string, required: false }
              - { label: Frozen Semen, name: frozen_semen, widget: string, required: false }
              - { label: Sire, name: sire, widget: string, required: false }
              - { label: Dam, name: dam, widget: string, required: false }
              - { label: Owner, name: owner, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: Phone, name: phone, widget: string }
              - { label: Notes, name: notes, widget: string, required: false }

      - label: Whelping Box
        name: whelping-box
        file: content/pages/whelping-box.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Content, name: body, widget: markdown }

  - name: links
    label: Links
    files:
      - label: Links
        name: links
        file: content/pages/links.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Content, name: body, widget: markdown }

      - label: Rainbow Bridge
        name: rainbow-bridge
        file: content/pages/rainbow-bridge.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: string }
          - { label: Content, name: body, widget: markdown }

      - label: Web Award
        name: web-award
        file: content/pages/web-award.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Content, name: body, widget: markdown }

      - label: Veterinary Links
        name: veterinary-links
        file: content/pages/veterinary-links.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Content, name: body, widget: markdown }
