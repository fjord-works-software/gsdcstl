backend:
  name: github
  repo: fjord-works-software/gsdcstl
  branch: main
  base_url: https://sveltia-cms-auth.fjordworkssoftware.workers.dev

media_folder: static/images
public_folder: /images

# Collections mirror the site navigation (src/lib/nav.ts) so an editor finds a
# page in the admin the same way they find it on the site. Keep the two in sync.
collections:
  - name: home
    label: Home
    files:
      - label: Home Page
        name: home
        file: content/pages/home.md
        fields:
          - { label: Title, name: title, widget: string, hint: "Heading of the About section" }
          - label: Banner
            name: hero
            widget: object
            fields:
              - { label: Small Line Above Heading, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string, hint: "An & in the heading is shown in gold" }
              - { label: Text, name: text, widget: text }
          - label: Centennial Strip
            name: centennial
            widget: object
            hint: "The gold strip under the banner. Update the text as centennial events are announced."
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: string }
              - { label: Link Text, name: link_label, widget: string, required: false }
              - { label: Link, name: link, widget: string, required: false, hint: "A page on this site, e.g. /events, or a full web address" }
          - label: Meetings
            name: meeting
            widget: object
            fields:
              - { label: When, name: when, widget: string, hint: "e.g. 3rd Tuesday of every month" }
              - { label: Time, name: time, widget: string, hint: "e.g. 7:00 p.m." }
              - { label: Place, name: place, widget: string, hint: "Name and full street address, used for the directions link" }
          - { label: Content, name: body, widget: markdown }

  - name: club-info
    label: Club Info
    files:
      - label: Club Info
        name: club-info
        file: content/pages/club-info.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Content, name: body, widget: markdown }

      - label: Constitution & By-Laws
        name: constitution-by-laws
        file: content/pages/constitution-by-laws.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Revision Note, name: revision_note, widget: string, hint: "e.g. Revision: 02/01/2020 · Adopted: 03/27/2020" }
          - { label: By-Laws PDF, name: pdf, widget: file, media_folder: /static/club-info, public_folder: /club-info, hint: "The full signed by-laws document offered by the Download PDF button" }
          - { label: Content, name: body, widget: markdown }

      - label: Club Contacts
        name: contacts
        file: content/contacts.json
        format: json
        fields:
          - { label: Year, name: year, widget: string }
          - { label: Club Phone, name: phone, widget: string }
          - label: Officers
            name: officers
            widget: list
            label_singular: Officer
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Email, name: email, widget: string }
          - label: Board of Directors
            name: board
            widget: list
            label_singular: Board Member
            fields:
              - { label: Name, name: name, widget: string }

      - label: Club Membership
        name: membership
        file: content/pages/membership.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Content, name: body, widget: markdown }

  - name: calendar
    label: Calendar
    files:
      - label: Regular Meetings
        name: calendar
        file: content/pages/calendar.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Content, name: body, widget: markdown }

  - name: education
    label: Education
    files:
      - label: Education (Breed Standard)
        name: education
        file: content/pages/education.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: string }
          - { label: Video URL 1, name: video_url_1, widget: string, hint: "YouTube embed URL, e.g. https://www.youtube.com/embed/..." }
          - { label: Video URL 2, name: video_url_2, widget: string, hint: "YouTube embed URL, e.g. https://www.youtube.com/embed/..." }
          - { label: Content, name: body, widget: markdown }

  - name: events
    label: Events
    files:
      - label: Events
        name: events
        file: content/pages/events.md
        fields:
          - { label: Title, name: title, widget: string }
          - label: Event Flyer Image
            name: event_flyer
            widget: image
            required: false
            hint: "Upload the current event flyer image"
          - { label: Description, name: body, widget: markdown }

      - label: Show Premium
        name: show-premium
        file: content/pages/show-premium.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Notice Title, name: notice_title, widget: string, required: false, hint: "e.g. ⚠ Venue Change. Leave the notice blank to hide the box." }
          - { label: Notice, name: notice, widget: string, required: false, hint: "Highlighted box at the top of the page. **bold** is allowed." }
          - { label: Heading, name: heading, widget: string, required: false }
          - label: Schedule
            name: schedule
            widget: list
            required: false
            label_singular: Show
            summary: "{{fields.date}} — {{fields.show}}"
            fields:
              - { label: Date & Time, name: date, widget: string, hint: "e.g. Friday 5/9/25 AM" }
              - { label: Show, name: show, widget: string, required: false }
              - { label: Judge, name: judge, widget: string, required: false }
              - { label: Event, name: event, widget: string, required: false }
          - { label: Notes, name: body, widget: markdown, required: false, hint: "Shown below the schedule, e.g. temperament test and entry deadlines" }
          - label: Show Secretary
            name: secretary
            widget: object
            required: false
            fields:
              - { label: Name, name: name, widget: string, required: false }
              - { label: Email, name: email, widget: string, required: false }
              - { label: Phone, name: phone, widget: string, required: false }
          - label: Buttons
            name: buttons
            widget: list
            required: false
            label_singular: Button
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: url, widget: string }

      - label: Event Results
        name: event-results
        file: content/pages/event-results.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Heading, name: heading, widget: string, required: false, hint: "e.g. May 11 & 12, 2019 Specialty Shows" }
          - { label: Results PDF, name: results_pdf, widget: file, required: false, media_folder: /static/events, public_folder: /events }
          - label: Shows
            name: shows
            widget: list
            required: false
            label_singular: Show
            summary: "{{fields.show}} — {{fields.judge}}"
            fields:
              - { label: Show, name: show, widget: string, hint: "e.g. Saturday 5/11/19 PM" }
              - { label: Judge, name: judge, widget: string, required: false }
              - label: Placements
                name: placements
                widget: list
                required: false
                label_singular: Placement
                summary: "{{fields.title}} — {{fields.dog}}"
                fields:
                  - { label: Award, name: title, widget: string, hint: "e.g. Best of Breed" }
                  - { label: Dog, name: dog, widget: string }
                  - { label: Sire, name: sire, widget: string, required: false }
                  - { label: Dam, name: dam, widget: string, required: false }
                  - { label: Breeders, name: breeders, widget: string, required: false }
                  - { label: Owners, name: owners, widget: string, required: false }
          - label: Photos
            name: photos
            widget: list
            required: false
            label_singular: Photo
            summary: "{{fields.caption}}"
            fields:
              - { label: Image, name: image, widget: image }
              - { label: Caption, name: caption, widget: string, hint: "Who/what is pictured. Also used as alt text." }

  - divider: true

  - name: brags
    label: Brag Entries
    label_singular: Brag
    folder: content/brags
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Full registered name and nickname, e.g. CH Guardians Gold Medal — 'Blondie'"
      - label: Date
        name: date
        widget: datetime
        type: date
        format: YYYY-MM-DD
      - label: Photo
        name: image
        widget: image
        required: false
      - label: Content
        name: body
        widget: markdown
        hint: "Include pedigree info (sire, dam, owners), show results, and any other details"

  - name: brags-pages
    label: Brags
    files:
      - label: Hall of Fame
        name: hall-of-fame
        file: content/hall-of-fame.json
        format: json
        fields:
          - label: Entries
            name: entries
            widget: list
            label_singular: Entry
            fields:
              - { label: Date, name: date, widget: string }
              - { label: Title / Achievement, name: title, widget: string }
              - { label: Dog, name: dog, widget: string }
              - { label: Member(s), name: member, widget: string }

      - label: "Wag 'N' Tongue Newsletters"
        name: wag-n-tongue
        file: content/wag-n-tongue.json
        format: json
        fields:
          - label: Newsletters
            name: newsletters
            widget: list
            label_singular: Newsletter
            fields:
              - { label: Label, name: label, widget: string, hint: "e.g. January 2018" }
              - { label: Filename, name: file, widget: string, hint: "PDF filename in /static/Documents/Wags/, e.g. January 2018 wag.pdf" }

      - label: Royal Hecht Awards (Intro & Point System)
        name: royal-hecht-awards
        file: content/pages/royal-hecht-awards.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: string }
          - label: Point System Classes
            name: point_classes
            widget: list
            label_singular: Class
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string, hint: "e.g. Class of 6+ entries:" }
              - { label: Places, name: places, widget: list, field: { label: Place, name: place, widget: string, hint: "e.g. 1st place — 5 points" } }
          - { label: Point System Note, name: points_note, widget: string, required: false }
          - { label: Special Awards, name: special_awards, widget: list, required: false, field: { label: Award, name: award, widget: string } }

  - name: royal-hecht-years
    label: Royal Hecht Years
    label_singular: Year
    folder: content/royal-hecht
    create: true
    extension: json
    format: json
    slug: "{{fields.year}}"
    identifier_field: year
    summary: "{{fields.year}}"
    fields:
      - { label: Year, name: year, widget: number, value_type: int }
      - { label: Ceremony Date, name: date, widget: string, required: false, hint: "e.g. April 21, 2026" }
      - { label: Chairperson, name: chairperson, widget: string, required: false }
      - label: Members
        name: members
        widget: list
        label_singular: Member
        summary: "{{fields.name}}"
        fields:
          - { label: Member(s), name: name, widget: string }
          - label: Awards
            name: awards
            widget: list
            label_singular: Award
            summary: "{{fields.category}}"
            fields:
              - { label: Award / Title, name: category, widget: string }
              - { label: Dog / Detail, name: detail, widget: string, required: false }

  - divider: true

  - name: photo-gallery
    label: Photo Gallery
    files:
      - label: Photo Gallery (Main Page)
        name: photo-gallery
        file: content/pages/photo-gallery.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Content, name: body, widget: markdown }





  - name: galleries
    label: Galleries
    label_singular: Gallery
    folder: content/galleries
    create: true
    media_folder: "{{media_folder}}/{{slug}}"
    public_folder: "{{public_folder}}/{{slug}}"
    identifier_field: title
    summary: "{{fields.order}}. {{fields.title}}"
    sortable_fields: [order, title]
    fields:
      - { label: Title, name: title, widget: string, hint: "Shown in the nav, on the gallery index and as the page heading" }
      - { label: Date / Subtitle, name: subtitle, widget: string, required: false }
      - { label: Order, name: order, widget: number, value_type: int, hint: "Lower numbers come first in the nav and on the index" }
      - { label: Description, name: body, widget: markdown, required: false }
      - label: Photos
        name: photos
        widget: list
        label_singular: Photo
        summary: "{{fields.caption}}"
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Caption, name: caption, widget: string, hint: "Who/what is pictured. Also used as alt text." }

  - name: breeders
    label: Breeders
    files:
      - label: Breeder Directory
        name: breeders
        file: content/pages/breeders.md
        fields:
          - { label: Title, name: title, widget: string }
          - label: Breeders
            name: breeders
            widget: list
            label_singular: Breeder
            summary: "{{fields.name}}"
            fields:
              - { label: Kennel Name, name: name, widget: string }
              - { label: Website, name: url, widget: string, required: false }
              - { label: Owners, name: owners, widget: string, required: false }
          - { label: Disclaimer, name: body, widget: markdown, hint: "Shown in small print below the breeder list" }

      - label: Stud Dogs
        name: stud-dogs
        file: content/stud-dogs.json
        format: json
        fields:
          - label: Dogs
            name: dogs
            widget: list
            label_singular: Stud Dog
            fields:
              - { label: Registered Name, name: registered_name, widget: string }
              - { label: Call Name, name: call_name, widget: string }
              - { label: Date of Birth, name: dob, widget: string, required: false }
              - { label: Stud Fee, name: stud_fee, widget: string }
              - { label: Requirements, name: requirements, widget: string, required: false }
              - { label: Frozen Semen, name: frozen_semen, widget: string, required: false }
              - { label: Sire, name: sire, widget: string, required: false }
              - { label: Dam, name: dam, widget: string, required: false }
              - { label: Owner, name: owner, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: Phone, name: phone, widget: string, required: false }
              - { label: Notes, name: notes, widget: string, required: false }

      - label: Whelping Box
        name: whelping-box
        file: content/pages/whelping-box.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Content, name: body, widget: markdown }

  - name: links
    label: Links
    files:
      - label: Links
        name: links
        file: content/pages/links.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Content, name: body, widget: markdown }

      - label: Rainbow Bridge
        name: rainbow-bridge
        file: content/pages/rainbow-bridge.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: string }
          - label: Memorials
            name: memorials
            widget: list
            label_singular: Memorial
            summary: "{{fields.name}}"
            fields:
              - { label: Dog, name: name, widget: string, hint: "Registered name and call name" }
              - { label: Dates, name: dates, widget: string, required: false, hint: "e.g. 08/01/2004 – 09/04/2014" }
              - { label: Owner, name: owner, widget: string, required: false }
          - { label: Footnote, name: body, widget: markdown, required: false, hint: "Small print at the bottom, e.g. how to add a memorial" }

      - label: Web Award
        name: web-award
        file: content/pages/web-award.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Heading, name: heading, widget: string, required: false }
          - label: Placings
            name: placings
            widget: list
            label_singular: Placing
            summary: "{{fields.club}}"
            fields:
              - { label: Club, name: club, widget: string }
              - { label: Person, name: person, widget: string, required: false }
              - { label: Highlight, name: highlight, widget: boolean, required: false, default: false, hint: "Bold this row (our club)" }
              - { label: Note, name: note, widget: string, required: false, hint: "e.g. 🥈 Second Place" }

      - label: Veterinary Links
        name: veterinary-links
        file: content/pages/veterinary-links.md
        fields:
          - { label: Title, name: title, widget: string }
          - label: Sections
            name: sections
            widget: list
            label_singular: Section
            summary: "{{fields.heading}}"
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Links
                name: links
                widget: list
                label_singular: Link
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: url, widget: string, required: false, hint: "Web address, or /Documents/DogMedicine/<file>.pdf for an uploaded document" }
